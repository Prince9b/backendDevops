name: Deployer sur VPS contabo 

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: prince
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd backendDevops
            git pull origin main
            docker compose down
            docker compose up --build -d